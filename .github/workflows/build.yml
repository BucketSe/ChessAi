name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make make

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build app
        run: python build.py

      - name: Test engine
        run: |
          app/engines/chessai.exe perftsuite 4
          app/engines/chessai.exe bench 10

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessAi-windows
          path: dist/ChessAi.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ChessAi.exe
          generate_release_notes: true
